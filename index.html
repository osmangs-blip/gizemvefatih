<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gizem & Fatih</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#f8f1f1,#fff);
    color:#333;
    text-align:center;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    font-size:1.2rem;
    margin-bottom:30px;
}

.countdown{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.box{
    background:white;
    padding:20px;
    border-radius:15px;
    min-width:90px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.number{
    font-size:2rem;
    font-weight:bold;
}

.label{
    font-size:.8rem;
    color:#777;
}

.footer{
    margin-top:40px;
    font-size:1rem;
}
</style>
</head>
<body>

<section class="hero">

<h1>Gizem ❤️ Fatih</h1>

<p class="subtitle">
Mutluluğumuza ortak olmanız dileğiyle
</p>

<div class="countdown">

<div class="box">
<div class="number" id="days">0</div>
<div class="label">Gün</div>
</div>

<div class="box">
<div class="number" id="hours">0</div>
<div class="label">Saat</div>
</div>

<div class="box">
<div class="number" id="minutes">0</div>
<div class="label">Dakika</div>
</div>

<div class="box">
<div class="number" id="seconds">0</div>
<div class="label">Saniye</div>
</div>

</div>

<div class="footer">
📅 Düğün Tarihi: 1 Ağustos 2026
</div>

</section>

<script>

const weddingDate = new Date("2026-08-01T19:00:00");

function updateCountdown(){

const now = new Date();
const diff = weddingDate - now;

if(diff <= 0){
document.body.innerHTML =
"<h1 style='margin-top:100px'>🎉 Bugün Düğün Günü 🎉</h1>";
return;
}

const days = Math.floor(diff/(1000*60*60*24));
const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((diff%(1000*60*60))/(1000*60));
const seconds = Math.floor((diff%(1000*60))/1000);

document.getElementById("days").innerText = days;
document.getElementById("hours").innerText = hours;
document.getElementById("minutes").innerText = minutes;
document.getElementById("seconds").innerText = seconds;

}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
